name: mysic
description: Aplicación móvil académica de exploración musical.
publish_to: none
version: 0.11.2-rc.12+4029

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  go_router: ^18.1.1
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  audio_service: ^0.18.19
  crypto: ^3.0.7
  material_color_utilities: ^0.13.0
  path_provider: ^2.1.6
  file_picker: ^13.4.0
  url_launcher: ^6.3.3
  sqflite: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/audio/mysic-demo.wav
    - assets/images/discover-mountains.webp
    - assets/images/mysic.png
    - assets/images/radio-kdvs.png
    - assets/images/radio-rovr.png
    - assets/images/radio-shonan-beach-fm.png

  fonts:
    # Las de Limusic (licencia OFL, ver assets/fonts/OFL-*.txt).
    - family: Oxanium
      fonts:
        - asset: assets/fonts/oxanium.ttf
          weight: 400
        - asset: assets/fonts/oxanium.ttf
          weight: 500
        - asset: assets/fonts/oxanium.ttf
          weight: 600
        - asset: assets/fonts/oxanium.ttf
          weight: 700
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/ibm_plex_sans.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_sans.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans.ttf
          weight: 600
        - asset: assets/fonts/ibm_plex_sans.ttf
          weight: 700
