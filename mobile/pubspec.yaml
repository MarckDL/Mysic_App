name: mysic
description: Aplicación móvil académica de exploración musical.
publish_to: none
version: 0.11.2-rc.9+4026

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  go_router: ^18.1.1
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  audio_service: ^0.18.19
  archive: ^4.7.1
  csv: ^8.0.0
  crypto: ^3.0.7
  path_provider: ^2.1.6
  file_picker: ^13.4.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/mysic-demo.wav
    - assets/images/discover-mountains.webp
