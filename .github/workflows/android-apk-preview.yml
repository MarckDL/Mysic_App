name: Android APK preview

on:
  workflow_dispatch:
  push:
    branches:
      - feat/waveform-signal-analysis

permissions:
  contents: write

jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: Format Dart and synchronize feature branch
        run: |
          dart format lib test
          if ! git diff --quiet -- lib test; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test
            git commit -m "style(flutter): apply Dart formatter"
            git push origin HEAD:feat/waveform-signal-analysis
          fi
      - run: flutter analyze
      - run: flutter test --no-enable-impeller
      # Debug preview only. A production APK needs secure signing, Firebase
      # client configuration, and the HTTPS API URL before distribution.
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: mysic-android-preview
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error
