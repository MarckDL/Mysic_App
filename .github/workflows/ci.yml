name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mysic_test
          POSTGRES_PASSWORD: mysic_test
          POSTGRES_DB: mysic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mysic_test -d mysic_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Credenciales efímeras del servicio CI; no corresponden a Supabase.
      DIRECT_URL: postgresql://mysic_test:mysic_test@localhost:5432/mysic_test
      TEST_DATABASE_URL: postgresql://mysic_test:mysic_test@localhost:5432/mysic_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --no-enable-impeller
      - run: python3 -m unittest discover -s tool -p 'test_*.py'
      - run: flutter build apk --debug
